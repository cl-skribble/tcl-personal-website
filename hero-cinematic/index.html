<!DOCTYPE html>
<html>
<body>
<div id="hero-cinematic" data-composition-id="hero-cinematic" data-start="0" data-width="1920" data-height="1080">

  <!-- Parent wrapper: handles overall position; Ken Burns lives on .hero-img child -->
  <div class="img-wrap">
    <img class="hero-img" src="lifestyle.jpeg" />
  </div>

  <!-- Cinematic dark overlay — bottom heavy, leaves sky breathing -->
  <div class="overlay-grad"></div>

  <!-- Vignette — edges darkened for depth -->
  <div class="vignette"></div>

  <!-- Subtle teal atmospheric haze, top-right (brand atmosphere) -->
  <div class="atmos-teal"></div>

  <!-- Magenta warm glow, bottom-left -->
  <div class="atmos-magenta"></div>

  <style>
    #hero-cinematic {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0c;
    }

    .img-wrap {
      position: absolute;
      inset: -15%;
      width: 130%;
      height: 130%;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 60% 30%;
      transform-origin: 60% 40%;
      display: block;
    }

    .overlay-grad {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(8, 8, 12, 0.30) 0%,
        rgba(8, 8, 12, 0.18) 25%,
        rgba(8, 8, 12, 0.22) 50%,
        rgba(8, 8, 12, 0.55) 75%,
        rgba(8, 8, 12, 0.82) 100%
      );
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 90% 80% at 50% 50%,
        transparent 35%,
        rgba(4, 4, 8, 0.50) 80%,
        rgba(4, 4, 8, 0.75) 100%
      );
    }

    .atmos-teal {
      position: absolute;
      top: -10%;
      right: -5%;
      width: 55%;
      height: 60%;
      background: radial-gradient(
        ellipse at 70% 30%,
        rgba(0, 187, 190, 0.18) 0%,
        transparent 60%
      );
      mix-blend-mode: screen;
    }

    .atmos-magenta {
      position: absolute;
      bottom: -5%;
      left: -5%;
      width: 50%;
      height: 55%;
      background: radial-gradient(
        ellipse at 30% 70%,
        rgba(183, 30, 108, 0.16) 0%,
        transparent 55%
      );
      mix-blend-mode: screen;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};

    const DURATION = 15;
    const tl = gsap.timeline({ paused: true });

    // Ken Burns — dramatic zoom + pan across cityscape
    tl.fromTo(
      ".hero-img",
      { scale: 1.0, x: 0, y: 0 },
      { scale: 1.18, x: -60, y: -25, duration: DURATION, ease: "none" },
      0
    );

    // Atmospheric teal — breathes in over the duration
    tl.fromTo(
      ".atmos-teal",
      { opacity: 0.6 },
      { opacity: 1.0, duration: DURATION, ease: "sine.inOut" },
      0
    );

    // Magenta glow — counter-phase, slightly offset
    tl.fromTo(
      ".atmos-magenta",
      { opacity: 1.0 },
      { opacity: 0.65, duration: DURATION, ease: "sine.inOut" },
      0
    );

    // Vignette — very subtly contracts to let frame breathe mid-play
    tl.fromTo(
      ".vignette",
      { opacity: 0.85 },
      { opacity: 1.0, duration: DURATION, ease: "power1.inOut" },
      0
    );

    window.__timelines["hero-cinematic"] = tl;
  </script>

</div>
</body>
</html>
